<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Лабораторная работа 7</title>
    <link rel="stylesheet" href="slick/slick.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Галерея котиков</h1>
    <div class="gallery">
        <button class="prev" type="button" aria-label="Назад">&#10094;</button>
        <div class="slider">
            <img src="images/1.jpg" width="600" height="600" alt="Тигрёнок">
            <img src="images/2.jpg" width="600" height="600" alt="Кот показывает язык">
            <img src="images/3.jpg" width="600" height="600" alt="Рыжий кот в очках">
            <img src="images/4.jpg" width="600" height="600" alt="Мокрый кот">
            <img src="images/5.jpg" width="600" height="600" alt="Серый кот">
            <img src="images/6.jpg" width="600" height="600" alt="Чёрный кот в галстуке">
            <img src="images/7.jpg" width="600" height="600" alt="Кот в каске">
            <img src="images/8.jpg" width="600" height="600" alt="Кот с ручками">
        </div>
        <button class="next" type="button" aria-label="Вперёд">&#10095;</button>
    </div>
    <div class="pager"></div>

    <script src="jquery-3.4.1.min.js"></script>
    <script src="slick/slick.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
